<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>打機佬 · 香港特價</title>
    <meta
      name="description"
      content="打機佬：香港 Steam、Nintendo Switch、PlayStation 今晚特價同消息。港幣價錢、商店封面，由 data.json 驅動。"
    />
    <meta name="theme-color" content="#f3eee6" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%231c1612' width='32' height='32' rx='6'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-size='16' fill='%23e7a322' font-family='sans-serif'%3E%E4%BB%94%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip" href="#deals-heading">跳去特價</a>
    <header class="mast">
      <div class="brand">
        <p class="chop">今晚</p>
        <div>
          <p class="kicker" id="kicker">載入緊…</p>
          <h1>打機佬</h1>
        </div>
      </div>
      <p class="region-pill" id="region-pill">香港 · HKD</p>
      <p class="lede" id="lede"></p>
    </header>

    <div class="sticky-bar">
      <nav id="filters" class="filters" aria-label="平台"></nav>
    </div>

    <main>
      <section aria-labelledby="deals-heading">
        <div class="section-head">
          <h2 id="deals-heading">特價</h2>
          <p id="deals-count" class="count"></p>
        </div>
        <div id="deals" class="deals"></div>
      </section>

      <section aria-labelledby="news-heading">
        <div class="section-head">
          <h2 id="news-heading">消息</h2>
          <p id="news-count" class="count"></p>
        </div>
        <div id="news" class="news"></div>
      </section>
    </main>

    <footer>
      <p id="note"></p>
    </footer>
    <script src="app.js"></script>
  </body>
</html>
